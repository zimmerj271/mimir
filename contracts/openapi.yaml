components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required:
      - error
      - request_id
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
          additionalProperties: false
    User:
      type: object
      additionalProperties: false
      properties:
        user_id: *id004
        username: &id006
          type: string
          maxLength: 1048576
          description: Canonical UTF-8 text, at most 1,048,576 encoded bytes, enforced server-side (maxLength is
            only an additional character bound). No silent truncation.
        display_name:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - user_id
      - username
      - display_name
    Session:
      type: object
      additionalProperties: false
      properties:
        user_id: *id004
        expires_at: &id007
          type: string
          format: date-time
        absolute_expires_at: *id007
        client_type:
          enum:
          - web
          - cli
      required:
      - user_id
      - expires_at
      - absolute_expires_at
      - client_type
    Project:
      type: object
      additionalProperties: false
      properties:
        project_id: *id004
        name: *id006
        description:
          oneOf:
          - *id006
          - type: 'null'
        status:
          enum:
          - active
          - archived
        created_at: *id007
      required:
      - project_id
      - name
      - description
      - status
      - created_at
    Conversation:
      type: object
      additionalProperties: false
      properties:
        conversation_id: *id004
        project_id:
          oneOf:
          - *id004
          - type: 'null'
        title: *id006
        conversation_version:
          type: integer
          minimum: 1
        status:
          enum:
          - active
          - archived
        updated_at: *id007
      required:
      - conversation_id
      - project_id
      - title
      - conversation_version
      - status
      - updated_at
    MessageContent:
      type: object
      additionalProperties: false
      properties:
        format:
          const: text/v1
        text: *id006
      required:
      - format
      - text
    Message:
      type: object
      additionalProperties: false
      properties:
        message_id: *id004
        revision_id: *id004
        conversation_id: *id004
        role:
          enum:
          - user
          - assistant
          - system
          - tool
        status:
          enum:
          - pending
          - completed
          - failed
          - interrupted
        ordinal: &id008
          type: integer
        content:
          $ref: '#/components/schemas/MessageContent'
        created_at: *id007
      required:
      - message_id
      - revision_id
      - conversation_id
      - role
      - status
      - ordinal
      - content
      - created_at
    Run:
      type: object
      additionalProperties: false
      properties:
        run_id: *id004
        kind:
          enum:
          - conversation
          - standalone
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          - interrupted
        checkpoint_text: *id006
        checkpoint_sequence:
          type: integer
          minimum: 0
        final_text:
          oneOf:
          - *id006
          - type: 'null'
        error_code:
          oneOf:
          - *id006
          - type: 'null'
        created_at: *id007
        completed_at:
          oneOf:
          - *id007
          - type: 'null'
        cancellation_requested:
          type: boolean
          description: True after accepted cancellation request until a terminal state is committed.
      required:
      - run_id
      - kind
      - status
      - checkpoint_text
      - checkpoint_sequence
      - final_text
      - error_code
      - created_at
      - completed_at
      - cancellation_requested
      description: Authoritative run resource. On completed status final_text is non-null and canonical (subject
        to seven-day standalone retention). On noncompleted status final_text is null. Cancellation_requested does
        not by itself imply cancelled.
    AcceptedRun:
      type: object
      additionalProperties: false
      properties:
        run_id: *id004
        message_id:
          oneOf:
          - *id004
          - type: 'null'
        conversation_version:
          oneOf:
          - *id008
          - type: 'null'
      required:
      - run_id
      - message_id
      - conversation_version
    Operation:
      type: object
      additionalProperties: false
      properties:
        operation_type: *id006
        idempotency_key: *id006
        run_id:
          oneOf:
          - *id004
          - type: 'null'
        conversation_id:
          oneOf:
          - *id004
          - type: 'null'
        status:
          enum:
          - accepted
          - completed
          - failed
          - cancelled
          - interrupted
        accepted_at: *id007
      required:
      - operation_type
      - idempotency_key
      - run_id
      - conversation_id
      - status
      - accepted_at
    Model:
      type: object
      additionalProperties: false
      properties:
        model_config_id: *id006
        display_name: *id006
        enabled:
          type: boolean
        supports_streaming:
          type: boolean
      required:
      - model_config_id
      - display_name
      - enabled
      - supports_streaming
    ListProjects:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        next_cursor:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - items
      - next_cursor
    ListConversations:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        next_cursor:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - items
      - next_cursor
    ListMessages:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - items
      - next_cursor
    ListModels:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
      - items
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        client_type:
          enum:
          - cli
          - web
      required:
      - username
      - password
      - client_type
    LoginResponse:
      type: object
      additionalProperties: false
      properties:
        access_token: *id006
        session:
          $ref: '#/components/schemas/Session'
      required:
      - access_token
      - session
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - name
    ProjectPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          oneOf:
          - *id006
          - type: 'null'
        status:
          enum:
          - active
          - archived
      required: []
    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        project_id:
          oneOf:
          - *id004
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 200
      required: []
    ConversationPatch:
      type: object
      additionalProperties: false
      properties:
        project_id:
          oneOf:
          - *id004
          - type: 'null'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          enum:
          - active
          - archived
        expected_conversation_version:
          type: integer
          minimum: 1
      required:
      - expected_conversation_version
    MessageSubmit:
      type: object
      additionalProperties: false
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'
        expected_conversation_version:
          type: integer
          minimum: 1
        model_config_id: *id006
      required:
      - content
      - expected_conversation_version
    StandaloneSubmit:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: UTF-8 max 1,048,576 bytes; server must enforce encoded length.
        model_config_id: *id006
      required:
      - prompt
    BranchCreate:
      oneOf:
      - $ref: '#/components/schemas/BranchAfterRevision'
      - $ref: '#/components/schemas/BranchReplaceMessage'
      discriminator:
        propertyName: mode
        mapping:
          after_revision: '#/components/schemas/BranchAfterRevision'
          replace_message: '#/components/schemas/BranchReplaceMessage'
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
          - ok
          - degraded
      required:
      - status
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          oneOf:
          - *id006
          - type: 'null'
      required: []
    BranchAfterRevision:
      type: object
      additionalProperties: false
      required:
      - mode
      - source_revision_id
      - expected_conversation_version
      properties:
        mode:
          const: after_revision
        source_revision_id:
          type: string
          format: uuid
        expected_conversation_version:
          type: integer
          minimum: 1
        title:
          type:
          - string
          - 'null'
    BranchReplaceMessage:
      type: object
      additionalProperties: false
      required:
      - mode
      - source_revision_id
      - expected_conversation_version
      properties:
        mode:
          const: replace_message
        source_revision_id:
          type: string
          format: uuid
        expected_conversation_version:
          type: integer
          minimum: 1
        title:
          type:
          - string
          - 'null'
    DeletionAccepted:
      type: object
      additionalProperties: false
      required:
      - deletion_id
      - status
      properties:
        deletion_id:
          type: string
          format: uuid
        status:
          const: accepted
