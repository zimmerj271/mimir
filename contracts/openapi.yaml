components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-mimir_session
      description: HTTPS-only web-issued session; mutually exclusive with bearer. See S01-AUTH in HTTP_SEMANTICS.md.
  parameters:
    BrowserCSRF:
      name: X-Mimir-CSRF
      in: header
      required: false
      description: Required with exact configured Origin for browser mutations including web login/logout. CLI bearer needs no CSRF. Failure is 403 forbidden. Conditional requirement cannot be enforced by security alternatives.
      x-mimir-browser-requirement: {"clients": ["web"], "mutations": "required", "authenticated_get": "not_required", "cli": "not_required"}
      schema:
        type: string
        const: '1'
    BrowserOrigin:
      name: Origin
      in: header
      required: false
      description: Browser mutations require exact configured trusted origin; reject missing/null/malformed/unauthorized. Authenticated GET rejects unauthorized Origin if present. Host/forwarded headers do not establish trust.
      x-mimir-browser-requirement: {"clients": ["web"], "mutations": "exact_configured_origin_required", "authenticated_get": "reject_unauthorized_if_present", "trust_from_host_or_forwarded": false}
      schema:
        type: string
  headers:
    NoStore:
      description: Credential/private session metadata responses are never cacheable.
      required: true
      schema:
        type: string
        const: no-store
    SessionCookie:
      description: Web login only; required for web, absent for CLI. __Host-mimir_session with HttpOnly; Secure; SameSite=Strict; Path=/; no Domain; Max-Age bounded by remaining absolute lifetime. Never include cookie values in examples.
      x-mimir-cookie: {"name": "__Host-mimir_session", "http_only": true, "secure": true, "same_site": "Strict", "path": "/", "domain": null, "required_for": "web", "forbidden_for": "cli", "transport": "https", "max_age": "positive_bounded_by_remaining_absolute_seconds"}
      schema:
        type: string
    ExpiredSessionCookie:
      description: Web logout expires __Host-mimir_session with Max-Age=0 and matching Path=/; HttpOnly; Secure; SameSite=Strict; no Domain. CLI logout has no session cookie.
      x-mimir-cookie: {"name": "__Host-mimir_session", "http_only": true, "secure": true, "same_site": "Strict", "path": "/", "domain": null, "required_for": "web", "forbidden_for": "cli", "transport": "https", "max_age": 0}
      schema:
        type: string
  schemas:
    Error:
      type: object
      required:
      - error
      - request_id
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              enum: [unauthenticated, forbidden, not_found, project_not_empty, conversation_version_conflict, idempotency_key_conflict, active_run_conflict, invalid_run_transition, operation_expired, operation_unknown, context_budget_exceeded, invalid_request, payload_too_large, rate_limited, dependency_unavailable, backend_timeout, ambiguous_credentials]
            message:
              type: string
            details:
              type: object
          additionalProperties: false
    User:
      type: object
      additionalProperties: false
      properties:
        user_id: *id004
        username: &id006
          type: string
          maxLength: 1048576
          description: Canonical UTF-8 text, at most 1,048,576 encoded bytes, enforced server-side (maxLength is
            only an additional character bound). No silent truncation.
        display_name:
          oneOf:
          - *id006
          - type: 'null'
      required:
      - user_id
      - username
      - display_name
    Session:
      type: object
      additionalProperties: false
      properties:
        user_id: *id004
        expires_at: &id007
          type: string
          format: date-time
        absolute_expires_at: *id007
        client_type:
          enum:
          - web
          - cli
      required:
      - user_id
      - expires_at
      - absolute_expires_at
      - client_type
    Project:
      type: object
      additionalProperties: false
      properties:
        project_id: *id004
        name: *id006
        description:
          oneOf:
          - *id006
          - type: 'null'
        status:
          enum:
          - active
          - archived
        created_at: *id007
      required:
      - project_id
      - name
      - description
      - status
      - created_at
    Conversation:
      type: object
      additionalProperties: false
      properties: &conversationProperties
        conversation_id: *id004
        project_id:
          oneOf:
          - *id004
          - type: 'null'
        title: *id006
        conversation_version:
          type: integer
          minimum: 1
        status:
          enum:
          - active
          - archived
        updated_at: *id007
      required:
      - conversation_id
      - project_id
      - title
      - conversation_version
      - status
      - updated_at
    ConversationDetail:
      type: object
      additionalProperties: false
      properties:
        <<: *conversationProperties
        active_run_id:
          type: [string, 'null']
          format: uuid
          readOnly: true
          description: "S01-DISCOVERY: eligible nonterminal conversational run at the same read snapshot, or null; always present. Derived reference; no canonical version/timestamp update."
      required:
      - conversation_id
      - project_id
      - title
      - conversation_version
      - status
      - updated_at
      - active_run_id
    MessageContent:
      type: object
      additionalProperties: false
      properties:
        format:
          const: text/v1
        text:
          allOf: [*id006]
          x-max-utf8-bytes: 1048576
      required:
      - format
      - text
    Message:
      type: object
      additionalProperties: false
      properties:
        message_id: *id004
        revision_id: *id004
        conversation_id: *id004
        role:
          enum:
          - user
          - assistant
          - system
          - tool
        status:
          enum:
          - completed
        ordinal: &id008
          type: integer
        content:
          $ref: '#/components/schemas/MessageContent'
        created_at: *id007
      required:
      - message_id
      - revision_id
      - conversation_id
      - role
      - status
      - ordinal
      - content
      - created_at
    Run:
      type: object
      additionalProperties: false
      properties:
        run_id: *id004
        kind:
          enum:
          - conversation
          - standalone
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          - interrupted
        checkpoint_text: *id006
        checkpoint_sequence:
          type: integer
          minimum: 0
        final_text:
          oneOf:
          - *id006
          - type: 'null'
        error_code:
          oneOf:
          - *id006
          - type: 'null'
        created_at: *id007
        completed_at:
          oneOf:
          - *id007
          - type: 'null'
        cancellation_requested:
          type: boolean
          description: True after accepted cancellation request until a terminal state is committed.
      required:
      - run_id
      - kind
      - status
      - checkpoint_text
      - checkpoint_sequence
      - final_text
      - error_code
      - created_at
      - completed_at
      - cancellation_requested
      allOf:
      - if:
          properties:
            status: {const: completed}
        then:
          properties:
            final_text: {type: string}
        else:
          properties:
            final_text: {type: 'null'}
      - if:
          properties:
            status: {enum: [completed, failed, cancelled, interrupted]}
        then:
          properties:
            cancellation_requested: {const: false}
      description: Authoritative run resource. On completed status final_text is non-null and canonical (subject
        to seven-day standalone retention). On noncompleted status final_text is null. Cancellation_requested does
        not by itself imply cancelled.
    AcceptedRun:
      type: object
      additionalProperties: false
      properties:
        run_id: *id004
        message_id:
          oneOf:
          - *id004
          - type: 'null'
        conversation_version:
          oneOf:
          - *id008
          - type: 'null'
      required:
      - run_id
      - message_id
      - conversation_version
    Operation:
      type: object
      additionalProperties: false
      properties:
        operation_type: *id006
        idempotency_key: *id006
        run_id:
          oneOf:
          - *id004
          - type: 'null'
        conversation_id:
          oneOf:
          - *id004
          - type: 'null'
        status:
          enum:
          - accepted
          - completed
          - failed
          - cancelled
          - interrupted
        accepted_at: *id007
      required:
      - operation_type
      - idempotency_key
      - run_id
      - conversation_id
      - status
      - accepted_at
    Model:
      type: object
      additionalProperties: false
      properties:
        model_config_id: *id006
        display_name: *id006
        enabled:
          type: boolean
        supports_streaming:
