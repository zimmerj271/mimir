name: Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.10'
          enable-cache: false
      - run: make check
      - run: make backend-check
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
        if: matrix.os == 'ubuntu-24.04'
        with:
          version: v5.5.1
      - name: Real service isolation and persistence
        if: matrix.os == 'ubuntu-24.04'
        run: make deployment-check
      - name: PR assignment and evidence
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pr.py "$GITHUB_EVENT_PATH"
      - name: Component gate status
        run: |
          echo 'Backend package/toolchain gates executed; application behavior remains unimplemented'
          echo 'CLI builds, race and PTY tests: NOT IMPLEMENTED (CLI-01 and successors)'
          echo 'Contract semantics/producer/consumer tests: NOT IMPLEMENTED (S01 and successors)'
          echo 'T02 real container tests run on Linux; macOS runs deterministic policy tests only'
          echo 'Application startup, Flyway migrations and full installation remain unimplemented'
