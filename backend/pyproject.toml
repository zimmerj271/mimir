[project]
name = "mimir-backend"
version = "0.1.0"
description = "Mimir backend package foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "ruff==0.17.1",
    "uv-build==0.12.10",
]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
required-version = "==0.12.10"
default-groups = ["dev", "test"]

[tool.ruff]
target-version = "py314"
src = ["src"]
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib --cov=mimir_backend --cov-report=term-missing --cov-report=xml"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mimir_backend"]

[tool.coverage.report]
show_missing = true
